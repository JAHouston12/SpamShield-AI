[project]
name = "spamshield-backend"
version = "0.1.0"
description = "SpamShield AI: FastAPI service and ML training pipeline for SMS spam detection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
